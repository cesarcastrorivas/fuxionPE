<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Sumador</title>
</head>
<body>
    <h1>Sumar dos numeros</h1>
    <form method="post">
        <input type="number" name="num1" step="any" required>
        <input type="number" name="num2" step="any" required>
        <button type="submit">Sumar</button>
    </form>
    {% if result is not none %}
    <p>Resultado: {{ result }}</p>
    {% endif %}
</body>
</html>
